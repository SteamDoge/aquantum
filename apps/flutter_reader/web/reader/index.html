<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!--
  Every byte this page renders comes from an imported book, so the content
  security policy allows only same-origin modules plus the data/blob URLs a
  book legitimately embeds. No network origin is reachable: an EPUB that
  contains scripts is filtered before iframe loading by book_security.js.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src blob:; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AQuantum Reader 文档视图</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--aq-background, #ffffff);
    /* The Flutter shell owns every visible colour; the page never guesses. */
    color-scheme: light dark;
  }
  #host {
    position: absolute;
    inset: 0;
    display: block;
  }
  foliate-view {
    display: block;
    width: 100%;
    height: 100%;
  }
  #notice {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: center;
    white-space: pre-wrap;
  }
  #notice[data-visible="1"] { display: flex; }
  html[data-page-effect] { --aq-enter-x: 100%; }
  html[data-page-backwards="true"] { --aq-enter-x: -100%; }
  html[data-page-effect]::view-transition-group(root) { animation-duration: 220ms; }
  html[data-page-effect]::view-transition-old(root) { animation: none; mix-blend-mode: normal; }
  html[data-page-effect]::view-transition-new(root) { mix-blend-mode: normal; animation: aq-cover 220ms ease-out both; }
  html[data-page-effect="curl"]::view-transition-new(root) { animation: aq-fold 260ms ease-out both; }
  @keyframes aq-cover { from { transform: translateX(var(--aq-enter-x)); } to { transform: translateX(0); } }
  @keyframes aq-fold {
    from { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); filter: brightness(.65); }
    55% { clip-path: polygon(30% 0, 100% 0, 100% 100%, 10% 100%); filter: brightness(.9); }
    to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); filter: brightness(1); }
  }
  html[data-page-effect="curl"][data-page-backwards="true"]::view-transition-new(root) { animation-name: aq-fold-back; }
  @keyframes aq-fold-back {
    from { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); filter: brightness(.65); }
    55% { clip-path: polygon(0 0, 70% 0, 90% 100%, 0 100%); filter: brightness(.9); }
    to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); filter: brightness(1); }
  }
</style>
</head>
<body>
<div id="host"></div>
<div id="notice" role="status" aria-live="polite"></div>
<!--
  bridge.js is the only module that talks to Flutter and is loaded last so a
  syntax error in it cannot stop the engine modules from defining their
  custom elements.
-->
<script type="module" src="./bridge.js"></script>
</body>
</html>
