name: aquantum_reader
description: A private, local-first reader with a shared Rust core.
publish_to: none
version: 0.0.15-rc.0+15

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  archive: ^4.5.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  scrollable_positioned_list: ^0.3.8
  pdfrx: ^2.6.5
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  crypto: ^3.0.7
  # Document formats (EPUB/MOBI/AZW3/FB2) are laid out by the vendored
  # foliate-js engine inside a WebView; the shell keeps every native control.
  webview_flutter: 4.14.1
  webview_windows: 0.4.0
  # Only Linux uses this family. Other platforms use the engines above.
  webview_all_linux: 1.4.6
  webview_platform_interface: 1.4.6
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  path_provider_windows: ^2.3.0
  path_provider_platform_interface: ^2.1.3
  shared_preferences_windows: ^2.4.1
  shared_preferences_platform_interface: ^2.4.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/navigation_glass.frag
  assets:
    # The reader page plus the MIT-licensed foliate-js engine it imports.
    - web/reader/
    - web/foliate/
    - web/foliate/vendor/
